name: Benzin fiyatı ve yayın

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'   # her gün 00:17 (İstanbul)
    - cron: '17 4 * * *'    # her gün 07:17 (İstanbul)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Ayrıştırıcı testleri
        run: node --test
      - name: Benzin fiyatını güncelle
        run: node scripts/update-fuel.mjs
      - name: fuel.json dosyasını kaydet
        run: |
          if ! git diff --quiet -- fuel.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fuel.json
            git commit -m "Benzin fiyatı güncellendi"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
